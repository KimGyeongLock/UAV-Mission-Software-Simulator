name: CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branchges: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build
    
    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure